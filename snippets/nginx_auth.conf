# LVS Agent nginx integration — gate licensed routes via auth_request
# Requires nginx auth_request module (standard in nginx >= 1.5.4)
#
# The agent returns: 200 = granted, 403 = rejected, 503 = agent unavailable.
# nginx auth_request reads the HTTP status code: 2xx = allow, 4xx/5xx = deny.
#
# Agent installation:
#   curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/JeremiahButtler/lvs-agent/main/install.sh | sudo bash
# More snippets and docs: https://github.com/JeremiahButtler/lvs-agent

# Add to your site's server {} block to gate licensed routes via LVS Agent

location /licensed-area/ {
    auth_request /lvs-auth;
    auth_request_set $lvs_status $upstream_status;
    error_page 403 = /license-required;
    # ... your proxy_pass or root here
}

location = /lvs-auth {
    internal;
    proxy_pass http://127.0.0.1:8788/authorize;
    proxy_pass_request_body on;
    proxy_set_header Content-Type application/json;
    # Replace with your LVS_LOCAL_TOKEN from /opt/lvs-agent/config.json
    proxy_set_header Authorization "Bearer YOUR_LOCAL_TOKEN";
    proxy_no_cache 1;
}
